<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The app is dark-themed (#0c0814). Declaring "dark" tells Chrome/Samsung
         Internet's auto-darkening ("Website dark mode") that the page already
         supports dark, so it must NOT repaint our colors — troop tokens and
         control markers are game state and have to stay exactly as authored.
         (Declaring "light" would invite the repaint, not prevent it.) -->
    <meta name="color-scheme" content="dark">
    <title>Tyrants of the Underdark</title>
    <style>
      /* Mobile: kill horizontal scroll-jank from overlays/button bars that
         nudge past the viewport edge. */
      html, body {
        overflow-x: hidden;
        width: 100%;
      }
      :root {
        color-scheme: dark;
      }
      /* Extra insurance against Samsung Internet / Chrome Android's "Website
         dark mode" repainting authored game-state colors. */
      html {
        forced-color-adjust: none;
      }
    </style>
  </head>
  <body style="margin:0;background:#0c0814;color:#e6e1f2;font-family:system-ui,sans-serif">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
